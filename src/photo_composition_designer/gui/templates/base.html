<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title | default("Photo Composition Designer") }}{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="app-header">
    <nav aria-label="Main navigation">
      <a class="brand" href="/">PCD</a>
      <a href="/projects">Projects</a>
      <a href="/settings">App settings</a>
      <a href="/layouts">Layouts</a>
      {% block header_context %}{% endblock %}
    </nav>
    {% block header_status %}<p class="save-state" data-save-state>{{ save_state | default("Saved") }}</p>{% endblock %}
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
