{% extends "base.html" %}

{% block content %}
<section class="panel settings-page">
  <h1>Application Settings</h1>
  <p>These settings are shared by all calendar projects.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if notice %}<p class="success" role="status">{{ notice }}</p>{% endif %}
  <form method="post" action="/settings" class="settings-form">
    <label for="anniversaries-path">Shared anniversaries.ini path</label>
    <input id="anniversaries-path" name="anniversaries_path"
           type="text" value="{{ anniversaries_path }}"
           placeholder="Leave empty to use the bundled default">
    <p class="muted">The file is read during rendering and is not copied into projects.</p>
    <button class="primary" type="submit">Save application settings</button>
  </form>
</section>
{% endblock %}
