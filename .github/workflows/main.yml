name: CI

# Linux is the always-on full-suite quality gate. Fast Windows tests run on
# main and on pull requests targeting main, not on every feature-branch push.
#
# Every push to any branch runs the Linux job, so feature and plan branches get
# feedback before a pull request exists.

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'HISTORY.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs for the same ref are cancelled, so the latest commit
  # gets its result sooner and no CI minutes are wasted on stale pushes.
  cancel-in-progress: true

jobs:
  tests:
    name: Linux / lint + full tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Install browser engines
        run: uv run playwright install --with-deps chromium firefox
      - name: Run linter and full test suite
        run: make testall

  tests-windows:
    name: Windows / fast tests
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run fast tests
        run: uv run pytest -s -vvvv -l --tb=long -m fast tests
