name: Release

# Triggered by a tag push, normally created by `make release`.
#
# Every release runs the Linux and Windows quality gates, creates the GitHub
# release, publishes to PyPI and builds the Linux and Windows artifacts.

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quality gate: lint + unit tests before any release artifact is created.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run quality gate (lint + tests)
        run: make test

  # Fast Windows tests gate the Windows build.
  quality-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run fast tests
        run: uv run pytest -s -vvvv -l --tb=long -m fast tests

  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Changelog
        run: .github/release_message.sh > release_message.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_message.md

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m build
          twine upload dist/*

  # The Linux build is part of every release. It uploads its archive to the
  # same GitHub release, so it waits for the `release` job to finish.
  build-linux:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Build Unified Linux Executable with PyInstaller
        run: make build-linux
      - name: Prepare ZIP file for release
        run: |
          cd release
          zip -r ../photo-composition-designer-linux.zip .
      - name: Upload ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: photo-composition-designer-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [release, quality-windows]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $dir = Split-Path (Get-Command iscc -ErrorAction Stop).Source
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Build Unified EXE with PyInstaller
        run: make build-win
      - name: Create portable USAGE.txt
        run: |
          cat > release/USAGE.txt <<'EOF'
          Photo Composition Designer

          Start the web UI:
            photo-composition-designer.exe gui --open-browser

          The console window stays open. Close it or use "Stop server" in the web UI.
          EOF
      - name: Verify release contents
        run: uv run python scripts/verify_release.py release
      - name: Build Windows installer
        run: make installer-win
      - name: Prepare ZIP file for release
        run: |
          powershell Compress-Archive -Path release/* -DestinationPath photo-composition-designer-win.zip
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            photo-composition-designer-win.zip
            dist/photo-composition-designer-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
