[project]
name = "photo-composition-designer"
dynamic = ["version"]
description = "Local-first, browser-based calendar composition designer."
authors = [
    {name = "pamagister"}
]
readme = "docs/index.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "astral>=3.2",
    "exifread>=3.5.1",
    "fastapi>=0.115.0",
    "geopandas>=1.1.1",
    "holidays>=0.84",
    "jinja2>=3.1.4",
    "matplotlib>=3.10.7",
    "pillow>=12.0.0",
    "pytz>=2025.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "shapely>=2.1.1",
    "onnxruntime>=1.26.0",
    "numpy>=2.4.6",
    "babel>=2.18.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

# Dev dependencies as optional dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-mock>=3.14.1",
    "coverage>=7.8.2",
    "flake8>=7.2.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest-cov>=6.1.1",
    "playwright>=1.65.2",
    "mypy>=1.16.0",
    "gitchangelog>=3.0.4",
    "pyinstaller>=5.8",
    "pre-commit>=4.2.0",
    "ruff>=0.11.13",
    "httpx2>=2.16.2",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=2.6.1",
    "pygments>=2.19.1",
]

[project.scripts]
photo-composition-designer = "photo_composition_designer.cli.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
photo_composition_designer = [
    "gui/templates/*.html",
    "gui/templates/partials/*.html",
    "gui/static/*",
]

[tool.setuptools_scm]
write_to = "src/photo_composition_designer/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: end-to-end Playwright tests; skipped when Playwright or browsers are missing.",
    "fast: quick baseline subset run by the default `make test` (via `-m fast`).",
    "slow: expensive tests (browser, rendering, export) excluded from `make test`; run with `make testall`.",
]

[tool.deptry]
optional_dependencies_dev_groups = ["dev", "docs"]

# jinja2 powers FastAPI's Jinja2Templates and python-multipart is required by
# FastAPI/Starlette to parse the Form() and File() payloads used throughout the
# GUI routes. Both are used only indirectly, so deptry cannot see the imports.
per_rule_ignores = { DEP002 = ["jinja2", "python-multipart"] }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/photo_composition_designer/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E721", "UP015", "B009", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
