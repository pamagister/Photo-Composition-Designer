site_name: Photo-Composition-Designer
site_url: !ENV READTHEDOCS_CANONICAL_URL
site_description: Turn a folder of photos into a beautifully designed calendar or collage book - locally, privately and without a cloud account.
repo_url: https://github.com/pamagister/Photo-Composition-Designer
repo_name: GitHub

# See also:
#  https://squidfunk.github.io/mkdocs-material/
#  https://www.mkdocs.org/user-guide/
#  Extensions: https://python-markdown.github.io/extensions/
#  - CodeHilite: https://python-markdown.github.io/extensions/code_hilite/

theme:
  name: readthedocs
  custom_dir: overrides
  highlightjs: true
  # Use the same project icon as the local web editor (see
  # src/photo_composition_designer/gui/static/favicon.svg). The readthedocs
  # theme ignores theme.favicon for the <link> tag, so overrides/main.html
  # wires it up explicitly.
  logo: _static/img/favicon.svg
  favicon: _static/img/favicon.svg
  features:
    - navigation.instant

extra_css:
  - css/custom.css

markdown_extensions:
  - toc:
      permalink: "#"
  - tables
  - admonition
  - codehilite:
      use_pygments: True

plugins:
   - awesome-nav
